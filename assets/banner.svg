<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="360" fill="none" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0e172a"/><stop offset="100%" stop-color="#030712"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="rgba(30, 41, 59, 0.7)"/><stop offset="100%" stop-color="rgba(15, 23, 42, 0.8)"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="10"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><style>@keyframes floatLeftRight{0%{transform:translateX(0) translateY(0)}50%{transform:translateX(25px) translateY(-10px)}}@keyframes floatPulse{0%{opacity:.25;transform:scale(1)}50%{opacity:.55;transform:scale(1.08)}}@keyframes pulseBeam{0%{stroke-dashoffset:0;opacity:.3}50%{stroke-dashoffset:60;opacity:.8}}@keyframes radarSweep{0%{transform:rotate(0deg)}}@keyframes cardFloat1{0%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes cardFloat2{0%{transform:translateY(0)}50%{transform:translateY(8px)}}.bg-grid{stroke:rgba(255,255,255,.04);stroke-width:1}.glow-blob1{animation:floatPulse 7s ease-in-out infinite;transform-origin:300px 180px}.glow-blob2{animation:floatPulse 9s ease-in-out infinite reverse;transform-origin:900px 180px}.beam-line{stroke:url(#accentGrad);stroke-width:2;stroke-dasharray:10,15;animation:pulseBeam 4s linear infinite}.floating-card-1{animation:cardFloat1 5s ease-in-out infinite}.floating-card-2{animation:cardFloat2 6s ease-in-out infinite}.text-shimmer{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}</style></defs><rect width="1200" height="360" fill="url(#bgGrad)" rx="16"/><rect width="1200" height="360" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" rx="16"/><g class="bg-grid"><line x1="100" x2="100" y1="0" y2="360"/><line x1="200" x2="200" y1="0" y2="360"/><line x1="300" x2="300" y1="0" y2="360"/><line x1="400" x2="400" y1="0" y2="360"/><line x1="500" x2="500" y1="0" y2="360"/><line x1="600" x2="600" y1="0" y2="360"/><line x1="700" x2="700" y1="0" y2="360"/><line x1="800" x2="800" y1="0" y2="360"/><line x1="900" x2="900" y1="0" y2="360"/><line x1="1000" x2="1000" y1="0" y2="360"/><line x1="1100" x2="1100" y1="0" y2="360"/><line x1="0" x2="1200" y1="60" y2="60"/><line x1="0" x2="1200" y1="120" y2="120"/><line x1="0" x2="1200" y1="180" y2="180"/><line x1="0" x2="1200" y1="240" y2="240"/><line x1="0" x2="1200" y1="300" y2="300"/></g><circle cx="280" cy="180" r="160" fill="#38bdf8" class="glow-blob1" filter="url(#glow)" opacity=".12"/><circle cx="920" cy="180" r="170" fill="#818cf8" class="glow-blob2" filter="url(#glow)" opacity=".14"/><circle cx="600" cy="90" r="120" fill="#c084fc" filter="url(#glow)" opacity=".1"/><path fill="none" d="M 50 180 Q 250 80, 450 180 T 850 180 T 1150 180" class="beam-line" opacity=".4"/><path fill="none" d="M 80 280 Q 350 320, 600 280 T 1120 280" class="beam-line" opacity=".25" style="animation-duration:6s"/><g class="floating-card-1" opacity=".75"><g transform="translate(60, 48)"><rect width="180" height="42" fill="url(#cardGrad)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" rx="8"/><circle cx="20" cy="21" r="5" fill="#38bdf8"/><text x="34" y="26" fill="#94a3b8" font-family="monospace" font-size="12">regex: /sym::index.*/</text></g><g transform="translate(70, 275)"><rect width="170" height="38" fill="url(#cardGrad)" stroke="rgba(129, 140, 248, 0.3)" stroke-width="1" rx="8"/><text x="18" y="24" fill="#a5b4fc" font-family="monospace" font-size="12">&gt; Zoekt trigram index</text></g></g><g class="floating-card-2" opaci